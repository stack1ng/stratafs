[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
# vendor holds patched copies of dependencies, which [patch.crates-io] points at.
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
async-lock = "3"
# The objc2 crates come from main, pinned, since only it has the macOS 27 SDK bindings (FSVolumeHandler).
# Move back to crates.io once a release includes them.
bitflags = "2.13"
blake3 = "1.8"
block2 = { git = "https://github.com/madsmtm/objc2", rev = "8a5abacd90d5403fc0463459a35826f892b9142e" }
blocking = "1.7"
bytes = "1.12"
cfg_aliases = "0.2"
clap = { version = "4.6", features = ["derive"] }
equivalent = "1.0"
event-listener = "5.4"
foldhash = "0.2"
futures-channel = "0.3.34"
futures-core = "0.3.34"
futures-executor = { version = "0.3.34", default-features = false, features = ["std", "thread-pool"] }
futures-lite = "2.6"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
hex = "0.4"
libc = "0.2"
mimalloc = "0.1.52"
nix = { version = "0.31", default-features = false, features = ["fs"] }
objc2 = { git = "https://github.com/madsmtm/objc2", rev = "8a5abacd90d5403fc0463459a35826f892b9142e" }
objc2-foundation = { git = "https://github.com/madsmtm/objc2", rev = "8a5abacd90d5403fc0463459a35826f892b9142e" }
objc2-fs-kit = { git = "https://github.com/madsmtm/objc2", rev = "8a5abacd90d5403fc0463459a35826f892b9142e" }
object_store = { version = "0.14", default-features = false }
plist = "1.10"
proptest = { version = "1.5", default-features = false, features = ["std"] }
rand = "0.10"
rangemap = "1.8"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
sha1 = "0.11"
shuttle = "0.9.7"
# TODO: move to smallvec 2 once it is stable, for the SmallVec<T, N> syntax (2.0.0-beta.3 as of 2026-10-23)
smallvec = { version = "1.16", features = ["union"] }
stateright = "0.31"
stratafs-content-conformance = { path = "crates/stratafs-content-conformance" }
stratafs-fs-engine = { path = "crates/stratafs-fs-engine" }
stratafs-fskit = { path = "crates/stratafs-fskit" }
stratafs-keyed-notify = { path = "crates/stratafs-keyed-notify" }
stratafs-kv-conformance = { path = "crates/stratafs-kv-conformance" }
stratafs-lock-synchronized = { path = "crates/stratafs-lock-synchronized" }
stratafs-mdbx = { path = "crates/stratafs-mdbx" }
stratafs-object-store = { path = "crates/stratafs-object-store" }
stratafs-range-bounds-map = { path = "crates/stratafs-range-bounds-map" }
stratafs-redb = { path = "crates/stratafs-redb" }
stratafs-serialized = { path = "crates/stratafs-serialized" }
stratafs-sqlite = { path = "crates/stratafs-sqlite" }
stratafs-store = { path = "crates/stratafs-store" }
stratafs-tree = { path = "crates/stratafs-tree" }
stratafs-websocket-pubsub = { path = "crates/stratafs-websocket-pubsub" }
storekey = "0.11"
thiserror = "2.0"
tokio = { version = "1.54", default-features = false }
tokio-tungstenite = "0.30"
toml = "0.9"
tracing = "0.1"
tracing-oslog = "0.3"
tracing-subscriber = "0.3"
uuid = "1"
wasm-bindgen = "=0.2.129"
weak-table = "0.4"
worker = "0.8.7"
xxhash-rust = { version = "0.8", features = ["const_xxh32"] }
zerocopy = { version = "0.8", features = ["alloc", "derive"] }

[patch.crates-io]
# mdbx-sys with libmdbx patched for stratafs-mdbx, see vendor/mdbx-sys/PATCHES.
mdbx-sys = { path = "vendor/mdbx-sys" }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev.package.libsqlite3-sys]
opt-level = 3

[profile.dev.package.mdbx-sys]
opt-level = 3

[profile.dev.package.redb]
opt-level = 3

[profile.dev.package.rusqlite]
opt-level = 3

[profile.dev.package.shuttle]
opt-level = 3

[profile.dev.package.shuttle-engine]
opt-level = 3

[profile.dev.package.shuttle-schedulers]
opt-level = 3

[profile.dev.package.shuttle-std]
opt-level = 3

[profile.dev.package.stateright]
opt-level = 3
