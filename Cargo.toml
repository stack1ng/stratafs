[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
bitflags = "2.13"
blake3 = "1.8"
blocking = "1.7"
bytes = "1.12"
cfg_aliases = "0.2"
equivalent = "1.0"
event-listener = "5.4"
futures-channel = "0.3.34"
futures-core = "0.3.34"
futures-lite = "2.6"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
opendal = { version = "0.59.4", default-features = false }
proptest = { version = "1.5", default-features = false, features = ["std"] }
send_wrapper = { version = "0.6", features = ["futures"] }
shuttle = "0.9.7"
# TODO: move to smallvec 2 once it is stable, for the SmallVec<T, N> syntax (2.0.0-beta.3 as of 2026-10-23)
smallvec = { version = "1.16", features = ["union"] }
stateright = "0.31"
stratafs-content-conformance = { path = "crates/stratafs-content-conformance" }
stratafs-keyed-notify = { path = "crates/stratafs-keyed-notify" }
stratafs-kv-conformance = { path = "crates/stratafs-kv-conformance" }
stratafs-opendal = { path = "crates/stratafs-opendal" }
stratafs-redb = { path = "crates/stratafs-redb" }
stratafs-serialized = { path = "crates/stratafs-serialized" }
stratafs-store = { path = "crates/stratafs-store" }
storekey = "0.11"
thiserror = "2.0"
vec1 = { version = "1.12", features = ["smallvec-v1"] }
xxhash-rust = { version = "0.8", features = ["const_xxh32"] }
zerocopy = { version = "0.8", features = ["alloc", "derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev.package.redb]
opt-level = 3

[profile.dev.package.shuttle]
opt-level = 3

[profile.dev.package.shuttle-engine]
opt-level = 3

[profile.dev.package.shuttle-schedulers]
opt-level = 3

[profile.dev.package.shuttle-std]
opt-level = 3

[profile.dev.package.stateright]
opt-level = 3
