# Mounts a real volume through each platform's kernel.
name: mounts

on:
  push:
    branches: [setup-ci]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install FUSE and the compilers libmdbx needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang libclang-dev pkg-config fuse3
      - name: Install the toolchain rust-toolchain.toml names
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Build the FUSE daemon
        run: cargo build --release --locked --package stratafs-fuse
      # A new volume's root belongs to root, and only the user who mounted a volume reaches it, so root does it all.
      - name: Mount a volume through FUSE
        run: |
          sudo --preserve-env=RUNNER_TEMP bash -e <<'SCRIPT'
          uname -r
          store="$RUNNER_TEMP/store"
          mount_point="$RUNNER_TEMP/mounted"
          mkdir -p "$mount_point"
          volume=$(target/release/stratafs-fuse create "$store" --store sqlite)
          target/release/stratafs-fuse mount "$store" "$mount_point" --volume "$volume" --store sqlite --consistency eventual &
          for _ in $(seq 1 30); do mountpoint -q "$mount_point" && break; sleep 1; done
          mountpoint "$mount_point"
          grep stratafs /proc/mounts
          echo mounted > "$mount_point/file"
          cat "$mount_point/file"
          umount "$mount_point"
          wait
          ! mountpoint -q "$mount_point"
          SCRIPT

  # xcode-27 is the hosted image that runs macOS 27, whose FSKit the module is built for.
  macos:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain rust-toolchain.toml names
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Build the benchmark module and its create command
        env:
          STRATAFS_BENCH_STORE: sqlite
        run: cargo build --release --locked --package stratafs-bench --bins
      - name: Mount a volume through FSKit
        env:
          DEVELOPER_ID_CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          FSKIT_PROVISIONING_PROFILE: ${{ secrets.FSKIT_PROVISIONING_PROFILE }}
        run: |
          sw_vers
          .github/scripts/mount-fskit.sh
