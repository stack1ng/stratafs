# Runs stratafs-e2e on mounts made through each system's kernel.
name: e2e

on:
  push:
    branches: [main, setup-ci]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: ${{ matrix.system }}, ${{ matrix.mounts }}, ${{ matrix.threads }} threads
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        system: [linux, macos]
        mounts: ["--strong 1", "--eventual 1", "--strong 2 --eventual 2"]
        threads: [1, 4]
        include:
          # A new volume's root belongs to root, and only the user who mounted a volume reaches it, so root runs it.
          - system: linux
            runner: ubuntu-24.04
            sudo: sudo
          # xcode-27 is the hosted image that runs macOS 27, whose FSKit the module is built for.
          - system: macos
            runner: xcode-27
        exclude:
          # TODO: run several mounts on macOS as soon as a runner has macOS 27.2. They fail on the hosted image's
          # macOS 27.0, where FSKit keeps a file's old size when another mount changes it, a bug Apple fixed in 27.2.
          - system: macos
            mounts: "--strong 2 --eventual 2"
    steps:
      - uses: actions/checkout@v4
      - name: Install FUSE and the compilers libmdbx needs
        if: matrix.system == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang libclang-dev pkg-config fuse3
      - name: Install the toolchain rust-toolchain.toml names
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.system }}
      - name: Build stratafs-e2e and the FUSE daemon
        if: matrix.system == 'linux'
        run: cargo build --release --locked --package stratafs-e2e --package stratafs-fuse
      # More than one mount of a volume needs a store several processes can open, which sqlite is.
      - name: Build stratafs-e2e and the benchmark FSKit module
        if: matrix.system == 'macos'
        env:
          STRATAFS_BENCH_STORE: sqlite
        run: cargo build --release --locked --package stratafs-e2e --package stratafs-bench --bins
      - name: Sign the FSKit module and enable it
        if: matrix.system == 'macos'
        env:
          DEVELOPER_ID_CERTIFICATE: ${{ secrets.DEVELOPER_ID_CERTIFICATE }}
          DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          FSKIT_PROVISIONING_PROFILE: ${{ secrets.FSKIT_PROVISIONING_PROFILE }}
        run: |
          sw_vers
          .github/scripts/install-fskit-module.sh
      - name: Run stratafs-e2e
        shell: bash
        run: >-
          ${{ matrix.sudo }} target/release/stratafs-e2e ${{ matrix.mounts }} --threads ${{ matrix.threads }}
          --directory "$RUNNER_TEMP/e2e"
      - name: Show the FSKit module's errors
        if: failure() && matrix.system == 'macos'
        run: >-
          log show --last 30m --style compact
          --predicate 'process == "stratafs-bench-extension" AND messageType >= 16' | tail -200
